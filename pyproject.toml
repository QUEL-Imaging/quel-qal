[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quel-qal"
version = "0.2.6"
description = "A Python library for analyzing QUEL Imaging fluorescent phantoms and imaging targets."
authors = [
    { name = "Emmanuel Mannoh" },
    { name = "Eammon Littler" },
    { name = "Ethan LaRochelle" },
]
maintainers = [
    { name = "QUEL Imaging, LLC", email = "devops@quelimaging.com" },
]
license = { text = "AGPL-3.0" }
readme = "README.md"
keywords = [
    "image-processing",
    "scientific-computing",
    "data-analysis",
    "research",
    "academia",
    "image-analysis",
    "python",
    "machine-learning"
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent"
]
requires-python = ">=3.12"
dependencies = [
    "ipympl>=0.10.0,<0.11",
    "matplotlib>=3.10.8,<3.11",
    "numba>=0.68.0,<0.69",
    "numpy>=2.5.4,<2.6",
    "opencv-contrib-python>=4.14.0.94,<6",
    "openpyxl>=3.1.5,<3.2",
    "pandas>=3.1.0,<3.2",
    "pooch>=1.9.0,<2",
    "pyyaml>=6.0.3,<7",
    "roipoly>=0.5.3,<0.6",
    "scikit-image>=0.26.0,<0.27",
    "scikit-learn>=1.9.1,<1.10",
    "scipy>=1.18.1,<1.19",
    "statsmodels>=0.15.0,<0.16",
    "tqdm>=4.70.1,<5",
    "lazy-loader>=0.6,<0.7",
]

[tool.spin.scripts]
pre-build = "rm -rf dist build *.egg-info"

[tool.spin]
package = "qal"

[tool.setuptools.packages.find]
where = ["."]
include = ["qal*"]

[tool.setuptools.package-data]
"qal.data" = ["product_presets/*.yaml", "product_presets/*.md"]

[project.urls]
homepage = "https://github.com/QUEL-Imaging/quel-qal/wiki"
repository = "https://github.com/QUEL-Imaging/quel-qal/tree/main"
documentation = "https://github.com/QUEL-Imaging/quel-qal/wiki"
