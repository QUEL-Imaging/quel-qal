name: Python compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        opencv: ["4.14.0.94", "5.0.0.93"]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the constrained environment and package
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install -c requirements-constraints.txt .
      - name: Select the OpenCV compatibility version
        # Replace the pinned wheel; never install a second cv2 distribution.
        run: |
          python -m pip install --no-deps opencv-contrib-python==${{ matrix.opencv }}
          python -m pip check
      - name: Run unit and feature tests
        # Depth-resolution analysis (#39) and batch examples are deferred.
        run: python -m pytest -q -k "not issue_39 and not batch"

  data-resolution:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MPLBACKEND: Agg
      # Same-repository and fork PRs both use their source repository/branch.
      # The checkout remains GitHub's synthetic merge commit for local tests.
      QAL_DATA_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      QAL_DATA_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      QAL_EXPECT_DATA_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      QAL_EXPECT_DATA_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      QAL_REQUIRE_DATA_PROVENANCE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Hydrate Git LFS data
        run: git lfs pull
      - name: Install test and package-build dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install build
          python -m pip install --no-deps .
      - name: Mocked resolution and wheel/sdist provenance tests
        run: python -m pytest -q tests/test_data_resolution.py tests/test_data_packaging.py
      - name: Validate every registered local dataset without HTTP
        env:
          QAL_TEST_LOCAL_LFS: "1"
        run: python -m pytest -q tests/test_data_integration.py -k checkout
      - name: Verify source-branch remote downloads (LFS and ordinary blobs)
        # Forks use their own public remote; never use pull_request_target or
        # an elevated token to execute pull-request code.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.private == false
        env:
          QAL_TEST_REMOTE: "1"
        run: python -m pytest -q tests/test_data_integration.py -k remote
      - name: Build distributable wheel through sdist with source provenance
        run: python -m build
      - name: Production remote-fetch smoke test after merge to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          QAL_TEST_REMOTE: "1"
          QAL_DATA_REF: main
          QAL_EXPECT_DATA_REF: main
        run: python -m pytest -q tests/test_data_integration.py -k remote
