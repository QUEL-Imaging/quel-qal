name: Python compatibility

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run every OS, Python, and OpenCV combination
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Cover each supported Python, OS, and OpenCV major in six routine jobs.
      # The exhaustive 18-job cross-product is available on manual dispatch.
      matrix: >-
        ${{ fromJSON(inputs.full_matrix &&
        '{"os":["ubuntu-latest","macos-latest","windows-latest"],
          "python":["3.12","3.13","3.14"],
          "opencv":["4.14.0.94","5.0.0.93"]}' ||
        '{"include":[
          {"os":"ubuntu-latest","python":"3.12","opencv":"5.0.0.93"},
          {"os":"ubuntu-latest","python":"3.13","opencv":"5.0.0.93"},
          {"os":"ubuntu-latest","python":"3.14","opencv":"5.0.0.93"},
          {"os":"ubuntu-latest","python":"3.12","opencv":"4.14.0.94"},
          {"os":"macos-latest","python":"3.12","opencv":"5.0.0.93"},
          {"os":"windows-latest","python":"3.12","opencv":"5.0.0.93"}]}') }}
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the constrained environment and package
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install -c requirements-constraints.txt .
      - name: Select the OpenCV compatibility version
        # Replace the pinned wheel; never install a second cv2 distribution.
        run: |
          python -m pip install --no-deps opencv-contrib-python==${{ matrix.opencv }}
          python -m pip check
      - name: Run unit and feature tests
        # Depth-resolution analysis (#39) and batch examples are deferred.
        run: python -m pytest -q --ignore=tests/test_example_saved_outputs.py -k "not issue_39 and not batch"

  saved-examples:
    name: Saved example outputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the constrained environment and package
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install -c requirements-constraints.txt .
          python -m pip check
      - name: Run saved-output integration tests once
        run: python -m pytest -q tests/test_example_saved_outputs.py
